[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-ai"
version = "0.1.0"
description = "Internal AI meeting recorder, assistant, and scheduled-task platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Meeting AI" }]
dependencies = [
  "flask>=3.0",
  "flask-sqlalchemy>=3.1",
  "flask-login>=0.6",
  "flask-wtf>=1.2",
  "flask-socketio>=5.3",
  "simple-websocket>=1.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "werkzeug>=3.0",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "python-dateutil>=2.9",
  "apscheduler>=3.10",
  "croniter>=2.0",
  "httpx>=0.27",
  "websockets>=12",
  # FunASR's online punctuation model converts one-element NumPy arrays with
  # int(array), which NumPy 2 rejects; keep the supported 1.x line until the
  # upstream inference adapter handles 2.x scalar extraction.
  "numpy>=1.26,<2.0",
  "onnxruntime>=1.20",
  "email-validator>=2.0",
  "itsdangerous>=2.1",
  "langgraph>=0.2",
  "langchain-core>=0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-flask>=1.3",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "jiwer>=3.0",
  "playwright>=1.45",
  "freezegun>=1.5",
]
eval = [
  "jiwer>=3.0",
]
diarization = [
  "pyannote.metrics>=3.2",
]
llm = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
]
mlx = [
  "mlx-audio==0.5.1; sys_platform == 'darwin'",
]
speech = [
  "funasr>=1.3",
  "torch>=2.3",
  "torchaudio>=2.3",
  "soundfile>=0.12",
  "modelscope>=1.39",
  # PyArrow 26 requires NumPy 2 at import time, while the application keeps
  # NumPy 1.x for FunASR's online punctuation adapter. datasets 4.8 requires
  # PyArrow 21+, so use the tested 21.x line.
  "pyarrow>=21,<22",
  "addict>=2.4",
  "simplejson>=3.19",
  "sortedcontainers>=2.4",
  "datasets>=4.8,<5",
  "Pillow>=12",
  "scipy>=1.13",
  "einops>=0.8",
]
tts = [
  "qwen-tts==0.1.1",
]
embed = [
  "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "local_llm: live loopback Qwen3.8 calls (skip unless RUN_LOCAL_LLM=1)",
  "e2e: playwright browser tests",
  "eval: speech/llm evaluation",
  "chaos: fault injection",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
timeout = 60

[tool.ruff]
line-length = 110
target-version = "py311"
